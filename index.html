<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIO-ORECA</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .screen.active {
      display: flex;
    }

    /* Intro Screen */
    #intro-screen {
      cursor: pointer;
    }

    .title-container {
      display: flex;
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: 5px;
      margin-bottom: 2rem;
    }

    .letter {
      display: inline-block;
      opacity: 0;
      transform: scale(3) rotate(15deg);
      animation: burstIn 0.8s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes burstIn {
      0% {
        opacity: 0;
        transform: scale(4) translate(-50px, -50px) rotate(-30deg);
        filter: blur(10px);
      }
      50% {
        opacity: 0.8;
        filter: blur(2px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translate(0, 0) rotate(0deg);
        filter: blur(0);
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px rgba(0, 150, 255, 0.6);
      }
    }

    .start-prompt {
      font-size: 1.5rem;
      color: #aaa;
      animation: pulse 1.5s infinite;
      margin-top: 1rem;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    /* Author Badge */
    .author-credit {
      position: absolute;
      bottom: 25px;
      right: 30px;
      font-size: 1.5rem;
      font-weight: 700;
      font-family: 'Georgia', 'Times New Roman', serif;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffd700, #ff8c00, #ff1493, #00bfff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 6s ease infinite, floatSmooth 3s ease-in-out infinite alternate;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes floatSmooth {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }

    /* Main Menu */
    h2 {
      font-size: 2.5rem;
      margin-bottom: 2rem;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .menu-btn {
      background: linear-gradient(145deg, #1e1e24, #121216);
      border: 1px solid #333;
      color: #fff;
      padding: 1.1rem 2.2rem;
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0.8rem;
      border-radius: 12px;
      cursor: pointer;
      width: 320px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .menu-btn:hover {
      border-color: #00d2ff;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 25px rgba(0, 210, 255, 0.3);
      color: #e0f7fc;
    }

    .back-btn {
      position: absolute;
      top: 25px;
      left: 25px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ddd;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(5px);
    }
    .back-btn:hover {
      border-color: #00d2ff;
      color: #fff;
      background: rgba(0, 210, 255, 0.1);
      transform: translateX(-3px);
    }

    /* Calculation Challenge Card Layout */
    .calc-card {
      background: linear-gradient(145deg, #121216, #1a1a24);
      border: 1px solid #333;
      border-radius: 16px;
      padding: 2rem;
      width: 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .timer-container {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid #333;
    }

    .timer-badge {
      background: #222;
      border: 1px solid #00d2ff;
      color: #00d2ff;
      padding: 0.4rem 1rem;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
    }

    .round-badge {
      font-size: 1.1rem;
      color: #aaa;
      font-weight: 600;
    }

    .problem-box {
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: 3px;
      margin: 1rem 0 1.5rem 0;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }

    .calc-input {
      width: 100%;
      padding: 0.8rem;
      font-size: 2rem;
      text-align: center;
      background: #08080c;
      border: 2px solid #444;
      border-radius: 10px;
      color: #fff;
      margin-bottom: 1.2rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .calc-input:focus {
      border-color: #00d2ff;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    .calc-submit-btn {
      width: 100%;
      padding: 0.9rem;
      font-size: 1.2rem;
      font-weight: bold;
      background: #007bff;
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }

    .calc-submit-btn:hover {
      background: #0056b3;
    }

    .feedback-msg {
      margin-top: 1rem;
      font-size: 1.1rem;
      min-height: 1.5rem;
      font-weight: bold;
    }

    .feedback-msg.correct {
      color: #4caf50;
    }

    .feedback-msg.wrong {
      color: #f44336;
    }

    /* Game 2: Snake Runner */
    #snake-canvas {
      background: #0d0d0d;
      border: 2px solid #333;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 255, 200, 0.15);
    }
  </style>
</head>
<body>

  <!-- Screen 1: Intro -->
  <div id="intro-screen" class="screen active">
    <div class="title-container" id="title-container"></div>
    <div class="start-prompt">(Start the game)</div>
    <div class="author-credit">By Anas Ahmed.</div>
  </div>

  <!-- Screen 2: Menu -->
  <div id="menu-screen" class="screen">
    <h2>Select Game</h2>
    <button class="menu-btn" id="btn-game1">1. Calculation Speed Challenge</button>
    <button class="menu-btn" id="btn-game2">2. Snake Tongue Runner</button>
  </div>

  <!-- Screen 3: Calculation Game -->
  <div id="calc-screen" class="screen">
    <button class="back-btn" onclick="exitCalcGame()">&larr; Menu</button>

    <div class="calc-card">
      <div class="timer-container">
        <div class="round-badge" id="calc-round">Round: 1 / Score: 0</div>
        <div class="timer-badge" id="calc-timer">⏱️ 60s</div>
      </div>

      <div class="problem-box" id="calc-problem">12 + 34</div>

      <form id="calc-form" onsubmit="submitCalcAnswer(event)" style="width: 100%;">
        <input type="number" id="calc-answer" class="calc-input" placeholder="Your Answer" autocomplete="off" autofocus>
        <button type="submit" class="calc-submit-btn">Submit Answer</button>
      </form>

      <div class="feedback-msg" id="calc-feedback"></div>

      <button class="menu-btn" id="calc-retry-btn" style="width: 100%; margin: 15px 0 0 0; padding: 0.8rem; display: none;" onclick="startCalcGame()">Retry Game</button>
    </div>
  </div>

  <!-- Screen 4: Snake Runner -->
  <div id="snake-screen" class="screen">
    <button class="back-btn" onclick="exitSnakeGame()">&larr; Menu</button>
    <h2>Tongue Runner</h2>
    <div class="status-text" id="snake-status">Score: 0</div>
    <canvas id="snake-canvas" width="400" height="400"></canvas>
    <div style="margin-top: 10px; color: #777; font-size: 0.9rem;">Use Arrow Keys or WASD to turn</div>
    <button class="menu-btn" id="snake-retry-btn" style="width: auto; padding: 0.8rem 2rem; margin-top: 15px;" onclick="startSnakeGame()">Retry Game</button>
  </div>

  <script>
    // --- Navigation & Flow ---
    const titleText = "DIO-ORECA";
    const titleContainer = document.getElementById('title-container');

    // Create burst animated letters
    titleText.split('').forEach((char, index) => {
      const span = document.createElement('span');
      span.className = 'letter';
      span.textContent = char === ' ' ? '\u00A0' : char;
      span.style.animationDelay = `${index * 0.1}s`;
      titleContainer.appendChild(span);
    });

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    document.getElementById('intro-screen').addEventListener('click', () => {
      showScreen('menu-screen');
    });

    document.getElementById('btn-game1').addEventListener('click', () => {
      showScreen('calc-screen');
      startCalcGame();
    });

    document.getElementById('btn-game2').addEventListener('click', () => {
      showScreen('snake-screen');
      startSnakeGame();
    });

    // --- Game 1: Calculation Speed Challenge ---
    let calcScore = 0;
    let calcRound = 1;
    let calcTimeLeft = 60;
    let calcTimerInterval = null;
    let currentProblemAnswer = 0;
    let isCalcActive = false;

    function startCalcGame() {
      calcScore = 0;
      calcRound = 1;
      calcTimeLeft = 60;
      isCalcActive = true;

      document.getElementById('calc-retry-btn').style.display = 'none';
      document.getElementById('calc-answer').disabled = false;
      document.getElementById('calc-answer').value = '';
      document.getElementById('calc-feedback').textContent = '';
      document.getElementById('calc-feedback').className = 'feedback-msg';

      updateCalcUI();
      generateCalcProblem();

      if (calcTimerInterval) clearInterval(calcTimerInterval);
      calcTimerInterval = setInterval(() => {
        calcTimeLeft--;
        document.getElementById('calc-timer').textContent = `⏱️ ${calcTimeLeft}s`;
        if (calcTimeLeft <= 0) {
          endCalcGame("⏰ Time's Up!");
        }
      }, 1000);

      setTimeout(() => document.getElementById('calc-answer').focus(), 100);
    }

    function exitCalcGame() {
      if (calcTimerInterval) clearInterval(calcTimerInterval);
      showScreen('menu-screen');
    }

    function updateCalcUI() {
      document.getElementById('calc-round').textContent = `Round: ${calcRound} | Score: ${calcScore}`;
      document.getElementById('calc-timer').textContent = `⏱️ ${calcTimeLeft}s`;
    }

    function generateCalcProblem() {
      let problemStr = "";

      if (calcRound <= 20) {
        // First 20 rounds: Multiplications (2-digit * 1-digit) and Additions (2-digit + 2-digit)
        const isMultiplication = Math.random() < 0.5;
        if (isMultiplication) {
          const num1 = Math.floor(Math.random() * 90) + 10; // 10-99
          const num2 = Math.floor(Math.random() * 8) + 2;   // 2-9
          currentProblemAnswer = num1 * num2;
          problemStr = `${num1} × ${num2}`;
        } else {
          const num1 = Math.floor(Math.random() * 90) + 10; // 10-99
          const num2 = Math.floor(Math.random() * 90) + 10; // 10-99
          currentProblemAnswer = num1 + num2;
          problemStr = `${num1} + ${num2}`;
        }
      } else {
        // After 20 rounds: Subtractions included
        const randType = Math.floor(Math.random() * 3);
        if (randType === 0) { // Multiplication
          const num1 = Math.floor(Math.random() * 90) + 10;
          const num2 = Math.floor(Math.random() * 8) + 2;
          currentProblemAnswer = num1 * num2;
          problemStr = `${num1} × ${num2}`;
        } else if (randType === 1) { // Addition
          const num1 = Math.floor(Math.random() * 90) + 10;
          const num2 = Math.floor(Math.random() * 90) + 10;
          currentProblemAnswer = num1 + num2;
          problemStr = `${num1} + ${num2}`;
        } else { // Subtraction
          const num1 = Math.floor(Math.random() * 90) + 10;
          const num2 = Math.floor(Math.random() * (num1 - 9)) + 10; // ensure positive result
          currentProblemAnswer = num1 - num2;
          problemStr = `${num1} − ${num2}`;
        }
      }

      document.getElementById('calc-problem').textContent = problemStr;
    }

    function submitCalcAnswer(e) {
      e.preventDefault();
      if (!isCalcActive) return;

      const userAnsInput = document.getElementById('calc-answer');
      const userAns = parseInt(userAnsInput.value);

      if (isNaN(userAns)) return;

      const feedback = document.getElementById('calc-feedback');

      if (userAns === currentProblemAnswer) {
        calcScore += 10;
        calcRound += 1;
        feedback.textContent = "✓ Correct!";
        feedback.className = "feedback-msg correct";
      } else {
        feedback.textContent = `✗ Wrong! Answer was ${currentProblemAnswer}`;
        feedback.className = "feedback-msg wrong";
        calcRound += 1;
      }

      userAnsInput.value = '';
      updateCalcUI();
      generateCalcProblem();
      userAnsInput.focus();
    }

    function endCalcGame(reason) {
      isCalcActive = false;
      if (calcTimerInterval) clearInterval(calcTimerInterval);

      document.getElementById('calc-answer').disabled = true;
      document.getElementById('calc-retry-btn').style.display = 'block';

      const feedback = document.getElementById('calc-feedback');
      feedback.textContent = `${reason} Final Score: ${calcScore} (${calcRound - 1} Rounds Solved)`;
      feedback.className = "feedback-msg";
    }

    // --- Game 2: Headless Snake Tongue Runner ---
    const canvas = document.getElementById('snake-canvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 10, y: 10 };
    let dx = 1, dy = 0;
    let score = 0;
    let snakeInterval = null;
    let isSnakeGameOver = false;

    function startSnakeGame() {
      snake = [
        { x: 5, y: 10 },
        { x: 4, y: 10 },
        { x: 3, y: 10 }
      ];
      dx = 1; dy = 0;
      score = 0;
      isSnakeGameOver = false;
      document.getElementById('snake-status').textContent = "Score: 0";
      spawnFood();
      if (snakeInterval) clearInterval(snakeInterval);
      snakeInterval = setInterval(updateSnake, 120);
    }

    function exitSnakeGame() {
      if (snakeInterval) clearInterval(snakeInterval);
      showScreen('menu-screen');
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
    }

    function updateSnake() {
      if (isSnakeGameOver) return;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        triggerSnakeGameOver();
        return;
      }

      // Self collision
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          triggerSnakeGameOver();
          return;
        }
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('snake-status').textContent = `Score: ${score}`;
        spawnFood();
      } else {
        snake.pop();
      }

      drawSnakeGame();
    }

    function triggerSnakeGameOver() {
      isSnakeGameOver = true;
      document.getElementById('snake-status').textContent = `Game Over! Final Score: ${score}`;
    }

    function drawSnakeGame() {
      // Clear background
      ctx.fillStyle = '#0d0d0d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid lines lightly
      ctx.strokeStyle = '#1a1a1a';
      for (let i = 0; i < canvas.width; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Food
      ctx.fillStyle = '#ff3366';
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * gridSize, (food.y + 0.5) * gridSize, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw Headless Snake with Forked Tongue
      snake.forEach((segment, index) => {
        const x = segment.x * gridSize;
        const y = segment.y * gridSize;

        if (index === 0) {
          // Front neck / tongue segment
          ctx.fillStyle = '#4caf50';
          ctx.fillRect(x + 2, y + 2, gridSize - 4, gridSize - 4);

          // Draw Forked Tongue extending forward
          ctx.strokeStyle = '#ff1744';
          ctx.lineWidth = 3;
          ctx.beginPath();

          let centerX = x + gridSize / 2;
          let centerY = y + gridSize / 2;

          if (dx === 1) { // right
            ctx.moveTo(x + gridSize, centerY);
            ctx.lineTo(x + gridSize + 10, centerY);
            ctx.lineTo(x + gridSize + 14, centerY - 4);
            ctx.moveTo(x + gridSize + 10, centerY);
            ctx.lineTo(x + gridSize + 14, centerY + 4);
          } else if (dx === -1) { // left
            ctx.moveTo(x, centerY);
            ctx.lineTo(x - 10, centerY);
            ctx.lineTo(x - 14, centerY - 4);
            ctx.moveTo(x - 10, centerY);
            ctx.lineTo(x - 14, centerY + 4);
          } else if (dy === 1) { // down
            ctx.moveTo(centerX, y + gridSize);
            ctx.lineTo(centerX, y + gridSize + 10);
            ctx.lineTo(centerX - 4, y + gridSize + 14);
            ctx.moveTo(centerX, y + gridSize + 10);
            ctx.lineTo(centerX + 4, y + gridSize + 14);
          } else if (dy === -1) { // up
            ctx.moveTo(centerX, y);
            ctx.lineTo(centerX, y - 10);
            ctx.lineTo(centerX - 4, y - 14);
            ctx.moveTo(centerX, y - 10);
            ctx.lineTo(centerX + 4, y - 14);
          }
          ctx.stroke();

        } else {
          // Body segments
          ctx.fillStyle = '#2e7d32';
          ctx.fillRect(x + 3, y + 3, gridSize - 6, gridSize - 6);
        }
      });
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code) && dy === 0) { dx = 0; dy = -1; }
      else if (['ArrowDown', 'KeyS'].includes(e.code) && dy === 0) { dx = 0; dy = 1; }
      else if (['ArrowLeft', 'KeyA'].includes(e.code) && dx === 0) { dx = -1; dy = 0; }
      else if (['ArrowRight', 'KeyD'].includes(e.code) && dx === 0) { dx = 1; dy = 0; }
    });
  </script>
</body>
</html>
