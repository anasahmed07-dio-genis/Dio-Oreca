<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DIO-ORECA</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at center, #0f0f18 0%, #000000 100%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Ambient background glowing particles */
    .bg-particles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(0, 210, 255, 0.15);
      animation: floatUp 10s infinite linear;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      padding: 1rem;
    }

    .screen.active {
      display: flex;
    }

    /* Intro Screen */
    #intro-screen {
      cursor: pointer;
    }

    .logo-container {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Unzoomed Logo Image Fits Screen Beautifully */
    .animated-logo {
      max-width: 420px;
      max-height: 60vh;
      width: 85vw;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.3), 0 0 60px rgba(0, 150, 255, 0.2);
      animation: logoEntrance 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, logoFloat 4s ease-in-out infinite alternate 1.2s;
    }

    @keyframes logoEntrance {
      0% {
        opacity: 0;
        transform: scale(0.3) rotate(-10deg);
        filter: blur(15px);
      }
      50% {
        opacity: 0.8;
        filter: blur(2px);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
        filter: blur(0);
      }
    }

    @keyframes logoFloat {
      0% {
        transform: translateY(0) scale(1);
        box-shadow: 0 0 30px rgba(0, 210, 255, 0.3), 0 0 60px rgba(0, 150, 255, 0.2);
      }
      100% {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 0 45px rgba(0, 210, 255, 0.5), 0 0 80px rgba(0, 150, 255, 0.4);
      }
    }

    .start-prompt {
      font-size: 1.5rem;
      color: #00d2ff;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      animation: pulseGlow 1.8s infinite;
      margin-top: 1rem;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(0.98); text-shadow: 0 0 5px rgba(0, 210, 255, 0.3); }
      50% { opacity: 1; transform: scale(1.03); text-shadow: 0 0 20px rgba(0, 210, 255, 0.8); }
    }

    /* Main Menu */
    h2 {
      font-size: 2.2rem;
      margin-bottom: 2rem;
      text-align: center;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }

    .menu-btn {
      background: linear-gradient(145deg, #1e1e24, #121216);
      border: 1px solid #333;
      color: #fff;
      padding: 1.1rem 2rem;
      font-size: 1.2rem;
      font-weight: 600;
      margin: 0.8rem;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      max-width: 340px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .menu-btn:hover, .menu-btn:active {
      border-color: #00d2ff;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 25px rgba(0, 210, 255, 0.3);
      color: #e0f7fc;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ddd;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(5px);
      z-index: 10;
    }
    .back-btn:hover {
      border-color: #00d2ff;
      color: #fff;
      background: rgba(0, 210, 255, 0.1);
    }

    .scores-dashboard {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 0.8rem;
      width: 100%;
      max-width: 400px;
      flex-wrap: wrap;
    }

    .score-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ddd;
    }

    .score-badge span {
      color: #00d2ff;
      font-weight: bold;
    }

    .status-text {
      font-size: 1.3rem;
      margin-bottom: 0.8rem;
      min-height: 1.8rem;
      text-align: center;
    }

    /* Mobile Controls for Snake Game */
    .mobile-controls {
      display: none;
      grid-template-columns: repeat(3, 55px);
      grid-template-rows: repeat(2, 55px);
      gap: 10px;
      margin-top: 15px;
      justify-content: center;
    }

    .dpad-btn {
      background: #1e1e24;
      border: 1px solid #444;
      color: #00d2ff;
      font-size: 1.5rem;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .dpad-btn:active {
      background: #00d2ff;
      color: #000;
    }

    /* Snake Runner Canvas */
    #snake-canvas {
      background: #0d0d0d;
      border: 2px solid #333;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 255, 200, 0.15);
      max-width: 90vw;
      max-height: 50vh;
      object-fit: contain;
    }

    /* Mobile Responsive Breakpoints */
    @media (max-width: 600px) {
      .mobile-controls {
        display: grid;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Particles -->
  <div class="bg-particles" id="bg-particles"></div>

  <!-- Screen 1: Intro -->
  <div id="intro-screen" class="screen active">
    <div class="logo-container">
      <img src="logo.jpg" alt="DIO-ORECA ANAS STUDIO Logo" class="animated-logo">
    </div>
    <div class="start-prompt">(Start the game)</div>
  </div>

  <!-- Screen 2: Menu -->
  <div id="menu-screen" class="screen">
    <button class="back-btn" onclick="showScreen('intro-screen')">&larr; Back to Start</button>
    <h2>Select Game</h2>
    <button class="menu-btn" id="btn-game2">Play Snake Tongue Runner</button>
  </div>

  <!-- Screen 3: Snake Runner -->
  <div id="snake-screen" class="screen">
    <button class="back-btn" onclick="exitSnakeGame()">&larr; Menu</button>
    <h2>Tongue Runner</h2>

    <div class="scores-dashboard">
      <div class="score-badge">Score: <span id="snake-current-score">0</span></div>
      <div class="score-badge">Previous: <span id="snake-prev-score">0</span></div>
      <div class="score-badge">High Score: <span id="snake-high-score">0</span></div>
    </div>

    <div class="status-text" id="snake-status">Get ready!</div>
    <canvas id="snake-canvas" width="400" height="400"></canvas>

    <!-- Touch D-Pad for Mobile -->
    <div class="mobile-controls">
      <div></div>
      <div class="dpad-btn" onclick="changeDirection('UP')">&uarr;</div>
      <div></div>
      <div class="dpad-btn" onclick="changeDirection('LEFT')">&larr;</div>
      <div class="dpad-btn" onclick="changeDirection('DOWN')">&darr;</div>
      <div class="dpad-btn" onclick="changeDirection('RIGHT')">&rarr;</div>
    </div>

    <button class="menu-btn" id="snake-retry-btn" style="width: auto; padding: 0.8rem 2rem; margin-top: 15px;" onclick="startSnakeGame()">Retry Game (or Press Spacebar)</button>
  </div>

  <script>
    // Create Background Particle Effects
    const particleContainer = document.getElementById('bg-particles');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 6 + 2;
      p.style.width = `${size}px`;
      p.style.height = `${size}px`;
      p.style.left = `${Math.random() * 100}%`;
      p.style.animationDelay = `${Math.random() * 10}s`;
      p.style.animationDuration = `${Math.random() * 8 + 6}s`;
      particleContainer.appendChild(p);
    }

    // --- Navigation & Flow ---
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    document.getElementById('intro-screen').addEventListener('click', () => {
      showScreen('menu-screen');
    });

    document.getElementById('btn-game2').addEventListener('click', () => {
      showScreen('snake-screen');
      startSnakeGame();
    });

    // --- Snake Tongue Runner ---
    const canvas = document.getElementById('snake-canvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 10, y: 10 };
    let dx = 1, dy = 0;
    let nextDx = 1, nextDy = 0;
    let score = 0;
    let previousScore = 0;
    let highScore = localStorage.getItem('dio_snake_highscore') ? parseInt(localStorage.getItem('dio_snake_highscore')) : 0;
    let snakeInterval = null;
    let isSnakeGameOver = false;

    // Initialize UI Score Badges
    document.getElementById('snake-high-score').textContent = highScore;

    function startSnakeGame() {
      snake = [
        { x: 5, y: 10 },
        { x: 4, y: 10 },
        { x: 3, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      isSnakeGameOver = false;

      document.getElementById('snake-current-score').textContent = score;
      document.getElementById('snake-prev-score').textContent = previousScore;
      document.getElementById('snake-high-score').textContent = highScore;
      document.getElementById('snake-status').textContent = "Run for food!";

      spawnFood();
      if (snakeInterval) clearInterval(snakeInterval);
      snakeInterval = setInterval(updateSnake, 120);
    }

    function exitSnakeGame() {
      if (snakeInterval) clearInterval(snakeInterval);
      showScreen('menu-screen');
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
    }

    function updateSnake() {
      if (isSnakeGameOver) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        triggerSnakeGameOver();
        return;
      }

      // Self collision
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          triggerSnakeGameOver();
          return;
        }
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('snake-current-score').textContent = score;

        if (score > highScore) {
          highScore = score;
          localStorage.setItem('dio_snake_highscore', highScore);
          document.getElementById('snake-high-score').textContent = highScore;
        }

        spawnFood();
      } else {
        snake.pop();
      }

      drawSnakeGame();
    }

    function triggerSnakeGameOver() {
      isSnakeGameOver = true;
      previousScore = score;
      document.getElementById('snake-prev-score').textContent = previousScore;

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('dio_snake_highscore', highScore);
        document.getElementById('snake-high-score').textContent = highScore;
      }

      document.getElementById('snake-status').textContent = `Game Over! Final Score: ${score} (Press Spacebar to retry)`;
    }

    function drawSnakeGame() {
      // Clear background
      ctx.fillStyle = '#0d0d0d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid lines lightly
      ctx.strokeStyle = '#1a1a1a';
      for (let i = 0; i < canvas.width; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Food
      ctx.fillStyle = '#ff3366';
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * gridSize, (food.y + 0.5) * gridSize, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Determine Snake Skin Color based on Score progression:
      // Score >= 400: Red skin
      // Score >= 200: Blue skin
      // Score >= 100: Yellow skin
      // Score < 100: Green skin
      let neckColor = '#4caf50';
      let bodyColor = '#2e7d32';

      if (score >= 400) {
        neckColor = '#ff3366';
        bodyColor = '#d50000';
      } else if (score >= 200) {
        neckColor = '#00d2ff';
        bodyColor = '#007bff';
      } else if (score >= 100) {
        neckColor = '#ffeb3b';
        bodyColor = '#fbc02d';
      }

      // Draw Headless Snake with Forked Tongue
      snake.forEach((segment, index) => {
        const x = segment.x * gridSize;
        const y = segment.y * gridSize;

        if (index === 0) {
          // Front neck / tongue segment
          ctx.fillStyle = neckColor;
          ctx.fillRect(x + 2, y + 2, gridSize - 4, gridSize - 4);

          // Draw Forked Tongue extending forward
          ctx.strokeStyle = '#ff1744';
          ctx.lineWidth = 3;
          ctx.beginPath();

          let centerX = x + gridSize / 2;
          let centerY = y + gridSize / 2;

          if (dx === 1) { // right
            ctx.moveTo(x + gridSize, centerY);
            ctx.lineTo(x + gridSize + 10, centerY);
            ctx.lineTo(x + gridSize + 14, centerY - 4);
            ctx.moveTo(x + gridSize + 10, centerY);
            ctx.lineTo(x + gridSize + 14, centerY + 4);
          } else if (dx === -1) { // left
            ctx.moveTo(x, centerY);
            ctx.lineTo(x - 10, centerY);
            ctx.lineTo(x - 14, centerY - 4);
            ctx.moveTo(x - 10, centerY);
            ctx.lineTo(x - 14, centerY + 4);
          } else if (dy === 1) { // down
            ctx.moveTo(centerX, y + gridSize);
            ctx.lineTo(centerX, y + gridSize + 10);
            ctx.lineTo(centerX - 4, y + gridSize + 14);
            ctx.moveTo(centerX, y + gridSize + 10);
            ctx.lineTo(centerX + 4, y + gridSize + 14);
          } else if (dy === -1) { // up
            ctx.moveTo(centerX, y);
            ctx.lineTo(centerX, y - 10);
            ctx.lineTo(centerX - 4, y - 14);
            ctx.moveTo(centerX, y - 10);
            ctx.lineTo(centerX + 4, y - 14);
          }
          ctx.stroke();

        } else {
          // Body segments
          ctx.fillStyle = bodyColor;
          ctx.fillRect(x + 3, y + 3, gridSize - 6, gridSize - 6);
        }
      });
    }

    function changeDirection(dir) {
      if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -1; }
      else if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = 1; }
      else if (dir === 'LEFT' && dx === 0) { nextDx = -1; nextDy = 0; }
      else if (dir === 'RIGHT' && dx === 0) { nextDx = 1; nextDy = 0; }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.getElementById('snake-screen').classList.contains('active')) {
        e.preventDefault();
        startSnakeGame();
        return;
      }

      if (['ArrowUp', 'KeyW'].includes(e.code)) changeDirection('UP');
      else if (['ArrowDown', 'KeyS'].includes(e.code)) changeDirection('DOWN');
      else if (['ArrowLeft', 'KeyA'].includes(e.code)) changeDirection('LEFT');
      else if (['ArrowRight', 'KeyD'].includes(e.code)) changeDirection('RIGHT');
    });
  </script>
</body>
</html>
