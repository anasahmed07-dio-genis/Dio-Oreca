<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DIO-ORECA</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at center, #0f0f18 0%, #000000 100%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Ambient background glowing particles */
    .bg-particles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(0, 210, 255, 0.15);
      animation: floatUp 10s infinite linear;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      padding: 1rem;
    }

    .screen.active {
      display: flex;
    }

    /* Intro Screen */
    #intro-screen {
      cursor: pointer;
    }

    .logo-container {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .animated-logo {
      max-width: 420px;
      max-height: 60vh;
      width: 85vw;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.3), 0 0 60px rgba(0, 150, 255, 0.2);
      animation: logoEntrance 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, logoFloat 4s ease-in-out infinite alternate 1.2s;
    }

    @keyframes logoEntrance {
      0% {
        opacity: 0;
        transform: scale(0.3) rotate(-10deg);
        filter: blur(15px);
      }
      50% {
        opacity: 0.8;
        filter: blur(2px);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
        filter: blur(0);
      }
    }

    @keyframes logoFloat {
      0% {
        transform: translateY(0) scale(1);
        box-shadow: 0 0 30px rgba(0, 210, 255, 0.3), 0 0 60px rgba(0, 150, 255, 0.2);
      }
      100% {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 0 45px rgba(0, 210, 255, 0.5), 0 0 80px rgba(0, 150, 255, 0.4);
      }
    }

    .start-prompt {
      font-size: 1.5rem;
      color: #00d2ff;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      animation: pulseGlow 1.8s infinite;
      margin-top: 1rem;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(0.98); text-shadow: 0 0 5px rgba(0, 210, 255, 0.3); }
      50% { opacity: 1; transform: scale(1.03); text-shadow: 0 0 20px rgba(0, 210, 255, 0.8); }
    }

    /* Main Menu */
    h2 {
      font-size: 2.2rem;
      margin-bottom: 2rem;
      text-align: center;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }

    .menu-btn {
      background: linear-gradient(145deg, #1e1e24, #121216);
      border: 1px solid #333;
      color: #fff;
      padding: 1.1rem 2rem;
      font-size: 1.2rem;
      font-weight: 600;
      margin: 0.8rem;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      max-width: 340px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .menu-btn:hover, .menu-btn:active {
      border-color: #00d2ff;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 25px rgba(0, 210, 255, 0.3);
      color: #e0f7fc;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ddd;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(5px);
      z-index: 10;
    }
    .back-btn:hover {
      border-color: #00d2ff;
      color: #fff;
      background: rgba(0, 210, 255, 0.1);
    }

    .scores-dashboard {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 0.8rem;
      width: 100%;
      max-width: 420px;
      flex-wrap: wrap;
    }

    .score-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ddd;
    }

    .score-badge span {
      color: #00d2ff;
      font-weight: bold;
    }

    .status-text {
      font-size: 1.3rem;
      margin-bottom: 0.8rem;
      min-height: 1.8rem;
      text-align: center;
    }

    /* Car Selection Cards */
    .car-select-container {
      display: flex;
      gap: 20px;
      margin: 1.5rem 0;
      flex-wrap: wrap;
      justify-content: center;
    }

    .car-card {
      background: linear-gradient(145deg, #1a1a24, #121218);
      border: 2px solid #333;
      border-radius: 16px;
      padding: 1.5rem;
      width: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .car-card:hover {
      border-color: #00d2ff;
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 12px 30px rgba(0, 210, 255, 0.3);
    }

    .car-preview {
      width: 70px;
      height: 110px;
      margin-bottom: 1rem;
      position: relative;
    }

    .car-title {
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
    }

    /* Mobile Controls */
    .mobile-controls {
      display: none;
      grid-template-columns: repeat(3, 55px);
      grid-template-rows: repeat(2, 55px);
      gap: 10px;
      margin-top: 15px;
      justify-content: center;
    }

    .dpad-btn {
      background: #1e1e24;
      border: 1px solid #444;
      color: #00d2ff;
      font-size: 1.5rem;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .dpad-btn:active {
      background: #00d2ff;
      color: #000;
    }

    .car-mobile-controls {
      display: none;
      gap: 20px;
      margin-top: 15px;
      justify-content: center;
    }

    .car-steer-btn {
      background: #1e1e24;
      border: 1px solid #444;
      color: #00d2ff;
      font-size: 2rem;
      width: 70px;
      height: 70px;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .car-steer-btn:active {
      background: #00d2ff;
      color: #000;
    }

    /* Game Canvas Elements */
    #snake-canvas, #car-canvas {
      background: #0d0d0d;
      border: 2px solid #333;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 255, 200, 0.15);
      max-width: 90vw;
      max-height: 50vh;
      object-fit: contain;
    }

    /* Mobile Responsive Breakpoints */
    @media (max-width: 600px) {
      .mobile-controls {
        display: grid;
      }
      .car-mobile-controls {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Particles -->
  <div class="bg-particles" id="bg-particles"></div>

  <!-- Screen 1: Intro -->
  <div id="intro-screen" class="screen active">
    <div class="logo-container">
      <img src="logo.jpg" alt="DIO-ORECA ANAS STUDIO Logo" class="animated-logo">
    </div>
    <div class="start-prompt">(Start the game)</div>
  </div>

  <!-- Screen 2: Menu -->
  <div id="menu-screen" class="screen">
    <button class="back-btn" onclick="showScreen('intro-screen')">&larr; Back to Start</button>
    <h2>Select Game</h2>
    <button class="menu-btn" id="btn-game2">Play Snake Tongue Runner</button>
    <button class="menu-btn" id="btn-game3">Play Tucky Car</button>
  </div>

  <!-- Screen 3: Car Selection -->
  <div id="car-select-screen" class="screen">
    <button class="back-btn" onclick="showScreen('menu-screen')">&larr; Menu</button>
    <h2>Select Your Car</h2>
    <div class="car-select-container">
      <div class="car-card" onclick="selectCar('TRUCK')">
        <canvas id="preview-truck" class="car-preview" width="70" height="110"></canvas>
        <div class="car-title" style="color:#ff3333;">Red Pickup Truck</div>
      </div>
      <div class="car-card" onclick="selectCar('SPORTS')">
        <canvas id="preview-sports" class="car-preview" width="70" height="110"></canvas>
        <div class="car-title" style="color:#ffffff;">White Sports Car</div>
      </div>
    </div>
  </div>

  <!-- Screen 4: Tucky Car Game -->
  <div id="car-screen" class="screen">
    <button class="back-btn" onclick="exitCarGame()">&larr; Menu</button>
    <h2>Tucky Car</h2>

    <div class="scores-dashboard">
      <div class="score-badge">Lives: <span id="car-lives">❤️❤️❤️</span></div>
      <div class="score-badge">Score: <span id="car-current-score">0</span></div>
      <div class="score-badge">Previous: <span id="car-prev-score">0</span></div>
      <div class="score-badge">High Score: <span id="car-high-score">0</span></div>
    </div>

    <div class="status-text" id="car-status">Dodge the obstacles!</div>
    <canvas id="car-canvas" width="360" height="500"></canvas>

    <!-- Mobile Steer Buttons -->
    <div class="car-mobile-controls">
      <div class="car-steer-btn" onclick="moveCarLane(-1)">&larr;</div>
      <div class="car-steer-btn" onclick="moveCarLane(1)">&rarr;</div>
    </div>

    <button class="menu-btn" id="car-retry-btn" style="width: auto; padding: 0.8rem 2rem; margin-top: 15px;" onclick="startCarGame()">Retry Game (or Press Spacebar)</button>
  </div>

  <!-- Screen 5: Snake Runner -->
  <div id="snake-screen" class="screen">
    <button class="back-btn" onclick="exitSnakeGame()">&larr; Menu</button>
    <h2>Tongue Runner</h2>

    <div class="scores-dashboard">
      <div class="score-badge">Score: <span id="snake-current-score">0</span></div>
      <div class="score-badge">Previous: <span id="snake-prev-score">0</span></div>
      <div class="score-badge">High Score: <span id="snake-high-score">0</span></div>
    </div>

    <div class="status-text" id="snake-status">Get ready!</div>
    <canvas id="snake-canvas" width="400" height="400"></canvas>

    <!-- Touch D-Pad for Mobile -->
    <div class="mobile-controls">
      <div></div>
      <div class="dpad-btn" onclick="changeDirection('UP')">&uarr;</div>
      <div></div>
      <div class="dpad-btn" onclick="changeDirection('LEFT')">&larr;</div>
      <div class="dpad-btn" onclick="changeDirection('DOWN')">&darr;</div>
      <div class="dpad-btn" onclick="changeDirection('RIGHT')">&rarr;</div>
    </div>

    <button class="menu-btn" id="snake-retry-btn" style="width: auto; padding: 0.8rem 2rem; margin-top: 15px;" onclick="startSnakeGame()">Retry Game (or Press Spacebar)</button>
  </div>

  <script>
    // Create Background Particle Effects
    const particleContainer = document.getElementById('bg-particles');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 6 + 2;
      p.style.width = `${size}px`;
      p.style.height = `${size}px`;
      p.style.left = `${Math.random() * 100}%`;
      p.style.animationDelay = `${Math.random() * 10}s`;
      p.style.animationDuration = `${Math.random() * 8 + 6}s`;
      particleContainer.appendChild(p);
    }

    // --- Navigation & Flow ---
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    document.getElementById('intro-screen').addEventListener('click', () => {
      showScreen('menu-screen');
    });

    document.getElementById('btn-game2').addEventListener('click', () => {
      showScreen('snake-screen');
      startSnakeGame();
    });

    document.getElementById('btn-game3').addEventListener('click', () => {
      showScreen('car-select-screen');
      drawCarPreviews();
    });

    // --- Snake Tongue Runner ---
    const snakeCanvas = document.getElementById('snake-canvas');
    const snakeCtx = snakeCanvas.getContext('2d');
    const gridSize = 20;
    const tileCount = snakeCanvas.width / gridSize;

    let snake = [];
    let food = { x: 10, y: 10 };
    let dx = 1, dy = 0;
    let nextDx = 1, nextDy = 0;
    let score = 0;
    let previousScore = 0;
    let highScore = localStorage.getItem('dio_snake_highscore') ? parseInt(localStorage.getItem('dio_snake_highscore')) : 0;
    let snakeInterval = null;
    let isSnakeGameOver = false;

    document.getElementById('snake-high-score').textContent = highScore;

    function startSnakeGame() {
      snake = [
        { x: 5, y: 10 },
        { x: 4, y: 10 },
        { x: 3, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      isSnakeGameOver = false;

      document.getElementById('snake-current-score').textContent = score;
      document.getElementById('snake-prev-score').textContent = previousScore;
      document.getElementById('snake-high-score').textContent = highScore;
      document.getElementById('snake-status').textContent = "Run for food!";

      spawnFood();
      if (snakeInterval) clearInterval(snakeInterval);
      snakeInterval = setInterval(updateSnake, 120);
    }

    function exitSnakeGame() {
      if (snakeInterval) clearInterval(snakeInterval);
      showScreen('menu-screen');
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
    }

    function updateSnake() {
      if (isSnakeGameOver) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        triggerSnakeGameOver();
        return;
      }

      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          triggerSnakeGameOver();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('snake-current-score').textContent = score;

        if (score > highScore) {
          highScore = score;
          localStorage.setItem('dio_snake_highscore', highScore);
          document.getElementById('snake-high-score').textContent = highScore;
        }

        spawnFood();
      } else {
        snake.pop();
      }

      drawSnakeGame();
    }

    function triggerSnakeGameOver() {
      isSnakeGameOver = true;
      previousScore = score;
      document.getElementById('snake-prev-score').textContent = previousScore;

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('dio_snake_highscore', highScore);
        document.getElementById('snake-high-score').textContent = highScore;
      }

      document.getElementById('snake-status').textContent = `Game Over! Final Score: ${score} (Press Spacebar to retry)`;
    }

    function drawSnakeGame() {
      snakeCtx.fillStyle = '#0d0d0d';
      snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);

      snakeCtx.strokeStyle = '#1a1a1a';
      for (let i = 0; i < snakeCanvas.width; i += gridSize) {
        snakeCtx.beginPath();
        snakeCtx.moveTo(i, 0); snakeCtx.lineTo(i, snakeCanvas.height);
        snakeCtx.moveTo(0, i); snakeCtx.lineTo(snakeCanvas.width, i);
        snakeCtx.stroke();
      }

      snakeCtx.fillStyle = '#ff3366';
      snakeCtx.beginPath();
      snakeCtx.arc((food.x + 0.5) * gridSize, (food.y + 0.5) * gridSize, gridSize / 2 - 2, 0, Math.PI * 2);
      snakeCtx.fill();

      let neckColor = '#4caf50';
      let bodyFill = '#2e7d32';

      // Snake Body Colors & Gradients (includes Purple & Aurora Blue Gradients)
      if (score >= 750) {
        // Aurora Blue Gradient
        neckColor = '#00f2fe';
        let grad = snakeCtx.createLinearGradient(0, 0, snakeCanvas.width, snakeCanvas.height);
        grad.addColorStop(0, '#00f2fe');
        grad.addColorStop(1, '#4facfe');
        bodyFill = grad;
      } else if (score >= 500) {
        // Purple Gradient
        neckColor = '#e040fb';
        let grad = snakeCtx.createLinearGradient(0, 0, snakeCanvas.width, snakeCanvas.height);
        grad.addColorStop(0, '#9c27b0');
        grad.addColorStop(1, '#e040fb');
        bodyFill = grad;
      } else if (score >= 400) {
        neckColor = '#ff3366';
        bodyFill = '#d50000';
      } else if (score >= 200) {
        neckColor = '#00d2ff';
        bodyFill = '#007bff';
      } else if (score >= 100) {
        neckColor = '#ffeb3b';
        bodyFill = '#fbc02d';
      }

      snake.forEach((segment, index) => {
        const x = segment.x * gridSize;
        const y = segment.y * gridSize;

        if (index === 0) {
          snakeCtx.fillStyle = neckColor;
          snakeCtx.fillRect(x + 2, y + 2, gridSize - 4, gridSize - 4);

          snakeCtx.strokeStyle = '#ff1744';
          snakeCtx.lineWidth = 3;
          snakeCtx.beginPath();

          let centerX = x + gridSize / 2;
          let centerY = y + gridSize / 2;

          if (dx === 1) {
            snakeCtx.moveTo(x + gridSize, centerY);
            snakeCtx.lineTo(x + gridSize + 10, centerY);
            snakeCtx.lineTo(x + gridSize + 14, centerY - 4);
            snakeCtx.moveTo(x + gridSize + 10, centerY);
            snakeCtx.lineTo(x + gridSize + 14, centerY + 4);
          } else if (dx === -1) {
            snakeCtx.moveTo(x, centerY);
            snakeCtx.lineTo(x - 10, centerY);
            snakeCtx.lineTo(x - 14, centerY - 4);
            snakeCtx.moveTo(x - 10, centerY);
            snakeCtx.lineTo(x - 14, centerY + 4);
          } else if (dy === 1) {
            snakeCtx.moveTo(centerX, y + gridSize);
            snakeCtx.lineTo(centerX, y + gridSize + 10);
            snakeCtx.lineTo(centerX - 4, y + gridSize + 14);
            snakeCtx.moveTo(centerX, y + gridSize + 10);
            snakeCtx.lineTo(centerX + 4, y + gridSize + 14);
          } else if (dy === -1) {
            snakeCtx.moveTo(centerX, y);
            snakeCtx.lineTo(centerX, y - 10);
            snakeCtx.lineTo(centerX - 4, y - 14);
            snakeCtx.moveTo(centerX, y - 10);
            snakeCtx.lineTo(centerX + 4, y - 14);
          }
          snakeCtx.stroke();
        } else {
          snakeCtx.fillStyle = bodyFill;
          snakeCtx.fillRect(x + 3, y + 3, gridSize - 6, gridSize - 6);
        }
      });
    }

    function changeDirection(dir) {
      if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -1; }
      else if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = 1; }
      else if (dir === 'LEFT' && dx === 0) { nextDx = -1; nextDy = 0; }
      else if (dir === 'RIGHT' && dx === 0) { nextDx = 1; nextDy = 0; }
    }

    // --- Tucky Car Runner Game ---
    const carCanvas = document.getElementById('car-canvas');
    const carCtx = carCanvas.getContext('2d');

    let selectedCarType = 'TRUCK'; // 'TRUCK' or 'SPORTS'
    let carLane = 1; // 0: Left, 1: Center, 2: Right
    const lanesX = [60, 180, 300]; // Lane X centers for 360px wide canvas
    let obstacles = [];
    let carScore = 0;
    let carPrevScore = 0;
    let carHighScore = localStorage.getItem('dio_car_highscore') ? parseInt(localStorage.getItem('dio_car_highscore')) : 0;
    let carGameInterval = null;
    let isCarGameOver = false;
    let roadOffset = 0;

    // Hit / Health System
    let carLives = 3;
    let invulnerableTimer = 0; // Frames of temporary immunity after a hit
    let hitTextTimer = 0; // Frames to display "HIT!" floating text
    let hitSparkX = 0, hitSparkY = 0;

    document.getElementById('car-high-score').textContent = carHighScore;

    function drawCarPreviews() {
      const pTruck = document.getElementById('preview-truck').getContext('2d');
      pTruck.clearRect(0, 0, 70, 110);
      drawRedPickupTruck(pTruck, 35, 55, 1, 0);

      const pSports = document.getElementById('preview-sports').getContext('2d');
      pSports.clearRect(0, 0, 70, 110);
      drawWhiteSportsCar(pSports, 35, 55, 1, 0);
    }

    function selectCar(type) {
      selectedCarType = type;
      showScreen('car-screen');
      startCarGame();
    }

    function updateLivesUI() {
      let hearts = "";
      for (let i = 0; i < carLives; i++) hearts += "❤️";
      if (carLives <= 0) hearts = "💀";
      document.getElementById('car-lives').textContent = hearts;
    }

    function startCarGame() {
      carLane = 1;
      obstacles = [];
      carScore = 0;
      carLives = 3;
      invulnerableTimer = 0;
      hitTextTimer = 0;
      isCarGameOver = false;

      updateLivesUI();
      document.getElementById('car-current-score').textContent = 0;
      document.getElementById('car-prev-score').textContent = carPrevScore;
      document.getElementById('car-high-score').textContent = carHighScore;
      document.getElementById('car-status').textContent = "Dodge the obstacles!";

      if (carGameInterval) clearInterval(carGameInterval);
      carGameInterval = setInterval(updateCarGame, 20);
    }

    function exitCarGame() {
      if (carGameInterval) clearInterval(carGameInterval);
      showScreen('menu-screen');
    }

    function moveCarLane(dir) {
      if (isCarGameOver) return;
      carLane += dir;
      if (carLane < 0) carLane = 0;
      if (carLane > 2) carLane = 2;
    }

    function updateCarGame() {
      if (isCarGameOver) return;

      roadOffset = (roadOffset + 8) % 40;
      carScore += 1;
      const displayScore = Math.floor(carScore / 5);
      document.getElementById('car-current-score').textContent = displayScore;

      if (displayScore > carHighScore) {
        carHighScore = displayScore;
        localStorage.setItem('dio_car_highscore', carHighScore);
        document.getElementById('car-high-score').textContent = carHighScore;
      }

      if (invulnerableTimer > 0) invulnerableTimer--;
      if (hitTextTimer > 0) hitTextTimer--;

      // Spawn obstacles
      if (Math.random() < 0.035) {
        const lane = Math.floor(Math.random() * 3);
        const lastObstacle = obstacles[obstacles.length - 1];
        if (!lastObstacle || lastObstacle.y > 120) {
          obstacles.push({
            lane: lane,
            y: -80,
            type: Math.random() < 0.5 ? 'BARRIER' : 'CONE'
          });
        }
      }

      // Update obstacles
      for (let i = 0; i < obstacles.length; i++) {
        obstacles[i].y += 7;

        // Collision check with player car (car is at Y = 400)
        const playerX = lanesX[carLane];
        const playerY = 400;

        const obsX = lanesX[obstacles[i].lane];
        const obsY = obstacles[i].y;

        if (invulnerableTimer === 0 && Math.abs(playerX - obsX) < 40 && Math.abs(playerY - obsY) < 50) {
          // BUMP HIT DETECTED!
          carLives--;
          updateLivesUI();
          invulnerableTimer = 60; // 60 frames (~1.2s) immunity
          hitTextTimer = 40; // Display "HIT!" message
          hitSparkX = (playerX + obsX) / 2;
          hitSparkY = (playerY + obsY) / 2;

          if (carLives <= 0) {
            triggerCarGameOver();
            return;
          } else {
            document.getElementById('car-status').textContent = `WARNING: BUMP HIT! ${carLives} Lives Remaining!`;
          }
        }
      }

      // Clean up off-screen obstacles
      obstacles = obstacles.filter(o => o.y < 550);

      drawCarGame();
    }

    function triggerCarGameOver() {
      isCarGameOver = true;
      carPrevScore = Math.floor(carScore / 5);
      document.getElementById('car-prev-score').textContent = carPrevScore;

      if (carPrevScore > carHighScore) {
        carHighScore = carPrevScore;
        localStorage.setItem('dio_car_highscore', carHighScore);
        document.getElementById('car-high-score').textContent = carHighScore;
      }

      document.getElementById('car-status').textContent = `Game Over! Score: ${carPrevScore} (Press Spacebar to retry)`;
      drawCarGame();
    }

    function drawCarGame() {
      // Clear Road Canvas
      carCtx.fillStyle = '#1e1e24';
      carCtx.fillRect(0, 0, carCanvas.width, carCanvas.height);

      // Red flash on hit frame
      if (hitTextTimer > 30) {
        carCtx.fillStyle = 'rgba(255, 0, 0, 0.25)';
        carCtx.fillRect(0, 0, carCanvas.width, carCanvas.height);
      }

      // Draw Road Lanes
      carCtx.strokeStyle = '#444';
      carCtx.lineWidth = 4;
      carCtx.strokeRect(2, 2, carCanvas.width - 4, carCanvas.height - 4);

      // Lane dividers
      carCtx.strokeStyle = '#f5b041';
      carCtx.lineWidth = 3;
      carCtx.setLineDash([20, 20]);
      carCtx.lineDashOffset = -roadOffset;

      carCtx.beginPath();
      carCtx.moveTo(120, 0); carCtx.lineTo(120, carCanvas.height);
      carCtx.moveTo(240, 0); carCtx.lineTo(240, carCanvas.height);
      carCtx.stroke();
      carCtx.setLineDash([]); // Reset dash

      // Draw Obstacles
      obstacles.forEach(o => {
        const x = lanesX[o.lane];
        const y = o.y;

        if (o.type === 'BARRIER') {
          // Road Barrier
          carCtx.fillStyle = '#e74c3c';
          carCtx.fillRect(x - 25, y - 15, 50, 30);
          carCtx.fillStyle = '#ffffff';
          carCtx.fillRect(x - 15, y - 15, 10, 30);
          carCtx.fillRect(x + 5, y - 15, 10, 30);
        } else {
          // Traffic Cone
          carCtx.fillStyle = '#ff7700';
          carCtx.beginPath();
          carCtx.moveTo(x, y - 20);
          carCtx.lineTo(x + 18, y + 15);
          carCtx.lineTo(x - 18, y + 15);
          carCtx.closePath();
          carCtx.fill();
        }
      });

      // Draw Player Car (Flashes during invulnerability)
      const playerX = lanesX[carLane];
      const playerY = 400;
      const displayScore = Math.floor(carScore / 5);

      if (invulnerableTimer === 0 || Math.floor(invulnerableTimer / 4) % 2 === 0) {
        if (selectedCarType === 'TRUCK') {
          drawRedPickupTruck(carCtx, playerX, playerY, 1, displayScore);
        } else {
          drawWhiteSportsCar(carCtx, playerX, playerY, 1, displayScore);
        }
      }

      // Draw Spark/Collision effect on hit
      if (hitTextTimer > 0) {
        carCtx.fillStyle = '#ffea00';
        carCtx.beginPath();
        carCtx.arc(hitSparkX, hitSparkY, 25, 0, Math.PI * 2);
        carCtx.fill();

        carCtx.fillStyle = '#ff1744';
        carCtx.font = 'bold 28px Arial';
        carCtx.textAlign = 'center';
        carCtx.fillText('💥 HIT!', playerX, playerY - 45);
      }
    }

    // --- Dynamic Car Body Gradient Selector ---
    function getCarBodyStyle(ctx, currentScore, defaultColor) {
      if (currentScore < 150) return defaultColor;

      let grad = ctx.createLinearGradient(-18, -30, 18, 30);

      if (currentScore >= 2050) {
        // Celestial Galaxy
        grad.addColorStop(0, '#e0c3fc'); grad.addColorStop(0.5, '#8ec5fc'); grad.addColorStop(1, '#ff0844');
      } else if (currentScore >= 1900) {
        // Dark Crimson Neon
        grad.addColorStop(0, '#ff0055'); grad.addColorStop(1, '#000000');
      } else if (currentScore >= 1750) {
        // Diamond Gold Silver
        grad.addColorStop(0, '#ffe000'); grad.addColorStop(0.5, '#ffffff'); grad.addColorStop(1, '#799f0c');
      } else if (currentScore >= 1600) {
        // Prism Rainbow
        grad.addColorStop(0, '#ff0000'); grad.addColorStop(0.2, '#ff7f00'); grad.addColorStop(0.4, '#ffff00');
        grad.addColorStop(0.6, '#00ff00'); grad.addColorStop(0.8, '#0000ff'); grad.addColorStop(1, '#8b00ff');
      } else if (currentScore >= 1450) {
        // Aurora Green-Blue
        grad.addColorStop(0, '#11998e'); grad.addColorStop(1, '#38ef7d');
      } else if (currentScore >= 1300) {
        // Hyper Red-Black
        grad.addColorStop(0, '#eb3349'); grad.addColorStop(1, '#f45c43');
      } else if (currentScore >= 1050) {
        // Cosmic Bronze Gold
        grad.addColorStop(0, '#f857a6'); grad.addColorStop(1, '#ff5858');
      } else if (currentScore >= 900) {
        // Electric Violet Pink
        grad.addColorStop(0, '#ec008c'); grad.addColorStop(1, '#fc6767');
      } else if (currentScore >= 750) {
        // Deep Ocean Blue Teal
        grad.addColorStop(0, '#2193b0'); grad.addColorStop(1, '#6dd5ed');
      } else if (currentScore >= 600) {
        // Flame Magenta Yellow
        grad.addColorStop(0, '#ff0844'); grad.addColorStop(1, '#ffb199');
      } else if (currentScore >= 450) {
        // Emerald Lime
        grad.addColorStop(0, '#0ba360'); grad.addColorStop(1, '#3cba92');
      } else if (currentScore >= 300) {
        // Cyber Cyan Purple
        grad.addColorStop(0, '#8e2de2'); grad.addColorStop(1, '#4a00e0');
      } else if (currentScore >= 150) {
        // Sunset Orange
        grad.addColorStop(0, '#f12711'); grad.addColorStop(1, '#f5af19');
      }

      return grad;
    }

    // --- Red Pickup Truck Rendering ---
    function drawRedPickupTruck(ctx, x, y, scale, currentScore) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      // Wheels
      ctx.fillStyle = '#111';
      ctx.fillRect(-22, -25, 8, 16);
      ctx.fillRect(14, -25, 8, 16);
      ctx.fillRect(-22, 15, 8, 16);
      ctx.fillRect(14, 15, 8, 16);

      // Truck Body Paint (Default Red or Dynamic Gradient at 150-score steps)
      ctx.fillStyle = getCarBodyStyle(ctx, currentScore, '#d32f2f');
      ctx.fillRect(-18, -30, 36, 60);

      // Pickup Truck Bed (Rear open area)
      ctx.fillStyle = '#1a0000';
      ctx.fillRect(-14, 5, 28, 20);

      // Cabin & Windshield
      ctx.fillStyle = '#111111';
      ctx.fillRect(-16, -20, 32, 22);

      ctx.fillStyle = '#80d8ff'; // Glass
      ctx.fillRect(-12, -18, 24, 10);

      // Headlights
      ctx.fillStyle = '#ffeb3b';
      ctx.fillRect(-16, -30, 8, 4);
      ctx.fillRect(8, -30, 8, 4);

      ctx.restore();
    }

    // --- White Sports Car Rendering ---
    function drawWhiteSportsCar(ctx, x, y, scale, currentScore) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      // Wheels
      ctx.fillStyle = '#111';
      ctx.fillRect(-20, -22, 6, 14);
      ctx.fillRect(14, -22, 6, 14);
      ctx.fillRect(-20, 15, 6, 14);
      ctx.fillRect(14, 15, 6, 14);

      // Sleek Sports Body (Default White or Dynamic Gradient at 150-score steps)
      ctx.fillStyle = getCarBodyStyle(ctx, currentScore, '#ffffff');
      ctx.beginPath();
      ctx.moveTo(0, -32);
      ctx.lineTo(16, -18);
      ctx.lineTo(16, 22);
      ctx.lineTo(12, 30);
      ctx.lineTo(-12, 30);
      ctx.lineTo(-16, 22);
      ctx.lineTo(-16, -18);
      ctx.closePath();
      ctx.fill();

      // Racing Stripes (Cyan)
      ctx.fillStyle = '#00d2ff';
      ctx.fillRect(-4, -30, 3, 58);
      ctx.fillRect(1, -30, 3, 58);

      // Windshield & Roof
      ctx.fillStyle = '#212121';
      ctx.fillRect(-10, -10, 20, 18);
      ctx.fillStyle = '#80d8ff';
      ctx.fillRect(-8, -8, 16, 8);

      // Spoiler
      ctx.fillStyle = '#212121';
      ctx.fillRect(-15, 26, 30, 4);

      // Headlights
      ctx.fillStyle = '#00e5ff';
      ctx.fillRect(-14, -30, 6, 3);
      ctx.fillRect(8, -30, 6, 3);

      ctx.restore();
    }

    // --- Key Event Listeners ---
    window.addEventListener('keydown', (e) => {
      // Spacebar Retry
      if (e.code === 'Space') {
        if (document.getElementById('snake-screen').classList.contains('active')) {
          e.preventDefault();
          startSnakeGame();
          return;
        }
        if (document.getElementById('car-screen').classList.contains('active')) {
          e.preventDefault();
          startCarGame();
          return;
        }
      }

      // Controls for Snake Game
      if (document.getElementById('snake-screen').classList.contains('active')) {
        if (['ArrowUp', 'KeyW'].includes(e.code)) changeDirection('UP');
        else if (['ArrowDown', 'KeyS'].includes(e.code)) changeDirection('DOWN');
        else if (['ArrowLeft', 'KeyA'].includes(e.code)) changeDirection('LEFT');
        else if (['ArrowRight', 'KeyD'].includes(e.code)) changeDirection('RIGHT');
      }

      // Controls for Tucky Car Game
      if (document.getElementById('car-screen').classList.contains('active')) {
        if (['ArrowLeft', 'KeyA'].includes(e.code)) moveCarLane(-1);
        else if (['ArrowRight', 'KeyD'].includes(e.code)) moveCarLane(1);
      }
    });
  </script>
